# Publishes n8n-nodes-html-to-slack to npm on every version tag push.
#
# n8n requires all community nodes published from May 2026 onward to include
# npm provenance statements. This workflow satisfies that requirement.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open your package settings.
#   2. Under "Publish access" → "Trusted Publishers" → "Add a publisher":
#        Repository owner: frer0t
#        Repository name:  n8n-nodes-html-to-slack
#        Workflow name:    publish.yml
#   3. Leave NPM_TOKEN unset — GitHub's OIDC token is used instead.
#
# Option B — npm Automation Token (fallback):
#   1. npmjs.com → Access Tokens → Generate New Token → Granular Access Token
#      scoped to this package with "Read and write" publish permission.
#   2. GitHub → Settings → Secrets → Actions → New secret named NPM_TOKEN.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
#   pnpm run release
#
# Lints, builds, bumps version, updates CHANGELOG, commits, tags, and pushes —
# which triggers this workflow to publish to npm.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Publish to npm
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          pnpm publish --provenance --no-git-checks --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
